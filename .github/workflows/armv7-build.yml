name: Build FFmpegKit ARMv7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config curl git \
            build-essential yasm nasm gperf texinfo bison ragel \
            python3 python3-pip unzip zip wget meson ninja-build \
            doxygen cmake autogen autopoint groff gtk-doc-tools \
            libtasn1-bin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build ARMv7 libraries
        working-directory: android-8.1-lts
        run: |
          set -o pipefail
          ./android.sh \
            --full \
            --enable-android-media-codec \
            --enable-android-zlib \
            --disable-lib-gnutls \
            --disable-arm64-v8a \
            --disable-x86 \
            --disable-x86-64 \
            2>&1 | tee build-console.log

      - name: Verify AAR contains ARMv7 libraries
        working-directory: android-8.1-lts
        run: |
          set -e
          AAR="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          test -f "$AAR"
          unzip -l "$AAR" | grep 'jni/armeabi-v7a/.*\.so'
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$AAR" "$GITHUB_WORKSPACE/output/ffmpeg-kit-armv7.aar"

      - name: Upload ARMv7 AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpegkit-armv7-aar
          path: output/ffmpeg-kit-armv7.aar
          if-no-files-found: error
          retention-days: 7
